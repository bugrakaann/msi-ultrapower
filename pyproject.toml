[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "msi-ultrapower"
version = "3.0.0"
description = "Power mode manager for MSI laptops on KDE Plasma"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["PySide6"]  # on Arch: pacman -S pyside6

[project.scripts]
msi-ultrapower = "msi_ultrapower.cli:main"

[project.gui-scripts]
msi-ultrapower-ui = "msi_ultrapower.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
