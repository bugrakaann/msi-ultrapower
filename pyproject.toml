[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pil-modu"
version = "3.0.0"
description = "Power mode manager for MSI laptops on KDE Plasma"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["PySide6"]  # Arch'ta pacman ile: pyside6

[project.scripts]
pil-modu = "pil_modu.cli:main"

[project.gui-scripts]
pil-modu-ui = "pil_modu.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
