name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext libegl1 libxkbcommon0
          pip install PySide6
      - name: Check install script
        run: bash -n install.sh
      - name: Byte-compile
        run: python -m compileall -q src
      - name: Check translations
        run: for po in po/*.po; do msgfmt --check -o /dev/null "$po"; done
      - name: Unit tests
        run: make test
